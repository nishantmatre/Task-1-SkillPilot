<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter-card">
    <p class="eyebrow">JAVASCRIPT PROJECT</p>
    <h1>Counter App</h1>
    <p class="subtitle">Click the button to increase the number.</p>

    <div class="counter-display" id="counter" aria-live="polite">0</div>

    <div class="actions">
      <button id="incrementBtn" class="increment-btn" type="button">Increment +</button>
      <button id="resetBtn" class="reset-btn" type="button">Reset</button>
    </div>
    <p class="hint">Your count updates instantly when you click Increment.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
